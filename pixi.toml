[workspace]
# Stable Mojo plus the minimal MAX core needed by max.algorithm/max.gpu.
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "trellis-mojo"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
test-runtime = "mojo run -I . tests/test_runtime.mojo"
test-sparse = "mojo run -I . tests/parity/test_sparse_basic.mojo"
# WP16 (fase 2): small-hole filling for the GLB export, pure-Mojo tests -> in test-all
test-wp16 = "mojo run -I . tests/parity/test_wp16_holes.mojo"
# WP18 (fase 2): narrow-band dual-contouring remesh, pure-Mojo tests -> in test-all
test-wp18 = "mojo run -I . tests/parity/test_wp18_remesh.mojo"
# Native QEM post-remesh decimation.
test-simplify = "mojo run -I . tests/test_simplify.mojo"
# WP11: GPU linear (tiled Metal GEMM) vs CPU linear, tolerance parity -> in test-all (needs the Metal GPU)
test-wp11 = "mojo run -I . tests/parity/parity_wp11_gpu_linear.mojo"
# WP11 step 3: GPU dense SDPA (GEMM composition) vs CPU varlen_sdpa -> in test-all (needs the Metal GPU)
test-wp11-attn = "mojo run -I . tests/parity/parity_wp11_gpu_attn.mojo"
# WP11 step 6: GPU sparse conv (gather kernel) vs CPU SparseConv3d -> in test-all (needs the Metal GPU)
test-wp11-conv = "mojo run -I . tests/parity/parity_wp11_gpu_conv.mojo"
# End-to-end pure-Mojo runner.
e2e = "mojo run -I . run_image_to_3d.mojo"
test-all = "mojo run -I . tests/test_runtime.mojo && mojo run -I . tests/parity/test_sparse_basic.mojo && mojo run -I . tests/parity/test_wp16_holes.mojo && mojo run -I . tests/parity/test_wp18_remesh.mojo && mojo run -I . tests/test_simplify.mojo && mojo run -I . tests/parity/parity_wp11_gpu_linear.mojo && mojo run -I . tests/parity/parity_wp11_gpu_attn.mojo && mojo run -I . tests/parity/parity_wp11_gpu_conv.mojo"

[dependencies]
# Stable Mojo 1.0.0
mojo = "==1.0.0"
# Mojo module support for parallel CPU kernels and Metal; unlike the
# `modular` meta-package, max-core does not pull framework frontends.
max-core = "==26.5.0"
